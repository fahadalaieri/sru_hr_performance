# Netlify deployment of the development/trial instance (2026-10-15).
# Next.js 16 is built by Netlify's own Next.js runtime (@netlify/plugin-nextjs),
# which it installs automatically — do not add or pin it in package.json.
# Environment variables live in the site's settings on Netlify, never here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The lockfile was generated with npm 11; use the same major on the build image.
  NPM_FLAGS = "--no-audit --no-fund"

# Upload-based deploys (no linked repo) do not auto-detect the framework
# plugin: the first deploy published .next as static files and served 404s.
# Declaring the runtime makes Netlify install it during the build. Unpinned
# on purpose — Netlify keeps it current.
[[plugins]]
  package = "@netlify/plugin-nextjs"
